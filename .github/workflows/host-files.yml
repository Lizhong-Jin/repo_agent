name: Tests and host file services

on:
  workflow_call:
  push:
  pull_request:
  workflow_dispatch:

# Keep only the newest branch/PR run; manual and tag acceptance runs stay independent.
concurrency:
  group: host-files-${{ github.workflow }}-${{ github.event_name }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  lint:
    name: Ruff lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
      - name: Install locked development tools
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: Check lint rules
        run: >-
          python -m ruff check
          agent cli llm tools sandbox host_support installer configuration scripts examples tests
          build_support.py build_manifest.py
      - name: Check formatting
        run: >-
          python -m ruff format --check
          agent cli llm tools sandbox host_support installer configuration scripts examples tests
          build_support.py build_manifest.py
      - name: Validate workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes=
      - name: Install pinned lock exporter
        run: python -m pip install uv==0.7.18
      - name: Validate distribution inputs and lock exports
        run: |
          python build_manifest.py
          python scripts/lock_dependencies.py --check
          python scripts/check_docs.py

  regression:
    name: Default suite (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-build.lock
      - name: Prepare development environment and installed entrypoints
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-build.lock
          .venv/bin/python -m pip install --no-build-isolation --no-deps -e .
      - name: Run all default tests
        run: .venv/bin/python -m pytest -q -ra --durations=15 --junitxml=artifacts/regression.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: regression-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/*.xml
          if-no-files-found: error

  # Linux/macOS contracts are already included in regression above.
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-build.lock
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock -r requirements-build.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pytest -q tests/test_architecture_boundaries.py tests/test_host_file_contracts.py tests/test_windows_files.py tests/test_windows_release.py tests/test_docker_acceptance.py tests/test_docker_backend.py tests/test_windows_job.py tests/test_cancellation.py tests/test_task_queue.py tests/test_continue.py tests/test_execution_ledger.py tests/test_task_reports.py tests/test_verification_plan.py tests/test_delivery.py tests/test_tui_reports.py tests/test_workspaces.py tests/test_review_mode.py tests/test_permissions.py tests/test_permission_adapters.py tests/test_scoped_services.py tests/test_unified_recovery.py tests/test_external_operations.py

  windows-isolation:
    name: Windows isolation contracts (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RUN_WINDOWS_ISOLATION_TESTS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-lsp.lock
          architecture: x64
      - name: Prepare isolated Windows test environment
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock -r requirements-lsp.lock
      - name: Build probe with installed SDK and run real isolation tests
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "ISOLATION_VS=%%i"
          if not defined ISOLATION_VS exit /b 1
          call "%ISOLATION_VS%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          .venv\Scripts\python.exe -m pytest -v -ra --durations=15 --junitxml=artifacts/windows-isolation.xml tests/test_windows_security.py tests/test_windows_isolation.py tests/test_windows_isolation_kernel.py tests/test_windows_native.py tests/test_windows_capabilities.py tests/test_native_execution_adapter.py tests/test_windows_supervisor_diagnostics.py tests/test_git_discovery.py tests/test_architecture_boundaries.py tests/test_windows_broker.py tests/test_execution_environment.py tests/test_process_runner.py

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-isolation-tests-${{ matrix.python }}
          path: artifacts/*.xml
          if-no-files-found: error

  windows-native:
    name: Windows native ${{ matrix.group }} (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
        group: [python-lsp, git-venv, integration]
        include:
          - group: python-lsp
            lsp: true
            tests: >-
              tests/test_windows_native_kernel.py::test_native_startup_python_worker_git_and_publication[python]
              tests/test_windows_native_kernel.py::test_native_startup_python_worker_git_and_publication[lsp]
          - group: git-venv
            lsp: false
            tests: >-
              tests/test_windows_native_kernel.py::test_native_startup_python_worker_git_and_publication[git]
              tests/test_windows_native_kernel.py::test_native_relocates_project_venv_without_changing_original
          - group: integration
            lsp: true
            tests: >-
              tests/test_windows_native_kernel.py::test_native_startup_python_worker_git_and_publication[all]
              tests/test_windows_native_kernel.py::test_recovery_keeps_retained_work_and_never_follows_junctions
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RUN_WINDOWS_ISOLATION_TESTS: '1'
      WINDOWS_NATIVE_CAPABILITY_REPORT: artifacts/windows-native.jsonl
      NATIVE_STARTUP_REPORT: artifacts/windows-native-startup.jsonl
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            ${{ matrix.lsp && 'requirements-lsp.lock' || 'requirements-dev.lock' }}
          architecture: x64
      - name: Prepare isolated Windows test environment
        run: |
          python -m venv --without-pip .venv
          python -m pip --python .venv install --no-compile --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: Install LSP only for groups exercising it
        if: matrix.lsp
        run: >-
          python -m pip --python .venv install --no-compile --require-hashes --only-binary=:all: -r requirements-lsp.lock
      - name: Run native group
        env:
          NATIVE_TESTS: ${{ matrix.tests }}
        shell: cmd
        run: |
          .venv\Scripts\python.exe -m pytest -v -raP --durations=15 --junitxml=artifacts/windows-native.xml %NATIVE_TESTS%
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-native-tests-${{ matrix.group }}-${{ matrix.python }}
          path: artifacts/*.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-native-capabilities-${{ matrix.group }}-${{ matrix.python }}
          path: artifacts/windows-native*.jsonl
          if-no-files-found: error

  windows-permissions:
    name: Windows mandatory permissions (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RUN_WINDOWS_ISOLATION_TESTS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
          architecture: x64
      - name: Prepare isolated Windows test environment
        run: |
          python -m venv --without-pip .venv
          python -m pip --python .venv install --no-compile --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: Build probe with installed SDK and require all permission tests
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "ISOLATION_VS=%%i"
          if not defined ISOLATION_VS exit /b 1
          call "%ISOLATION_VS%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          .venv\Scripts\python.exe scripts/release_acceptance.py run --profile permissions --target windows-x86_64 --output artifacts/windows-permissions
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-permissions-${{ matrix.python }}
          path: artifacts/windows-permissions/
          if-no-files-found: error
