name: Rust policy scanner equivalence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equivalence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/policy-scan-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Prepare Python tools
        run: |
          python -m pip install -e '.[dev]' 'maturin>=1.9,<2'
      - name: Check Rust and run unit tests
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked
        env:
          PYO3_PYTHON: python
      - name: Build and install platform wheel
        run: |
          python scripts/build_rust.py wheel --no-build-isolation
          python -m pip install rust_wheels/*.whl
          python -c 'import repo_agent_scan; assert repo_agent_scan.API_VERSION == 1'
      - name: Differential and integration contracts
        run: python -m pytest -q -ra tests/test_rust_policy_scan.py tests/test_policy_scan_contract.py tests/test_linux_policy_scan.py tests/test_linux_merged_preflight.py tests/test_wsl_drivers.py
