name: Rust policy scanner equivalence

on:
  workflow_call:
  push:
  pull_request:
  workflow_dispatch:

env:
  RUSTUP_TOOLCHAIN: 1.89.0

# Keep only the newest branch/PR run; manual and tag acceptance runs stay independent.
concurrency:
  group: policy-scan-rust-${{ github.workflow }}-${{ github.event_name }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

permissions:
  contents: read

jobs:
  equivalence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Initialize build environment
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/policy-scan-target" >> "$GITHUB_ENV"
          python -c 'from pathlib import Path; from installer.rust_extension import rust_version; print("RUST_BACKEND_VERSION=" + rust_version(Path.cwd()))' >> "$GITHUB_ENV"
      - name: Install Rust
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy --component rustfmt
      - name: Prepare Python tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock -r requirements-build.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip install maturin==1.9.6
      - name: Check Rust and run unit tests
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked
        env:
          PYO3_PYTHON: python
      - name: Build and install platform wheel
        run: |
          python scripts/build_rust.py wheel --target host --no-build-isolation --compatibility linux
          python -m pip install rust_wheels/${{ env.RUST_BACKEND_VERSION }}/rust_backend-*.whl
          python -c 'import rust_backend; assert rust_backend.API_VERSION == 1; assert rust_backend.FILESYSTEM_API_VERSION == 2; assert hasattr(rust_backend, "scan_metadata"); assert rust_backend.SCAN_PARALLEL_VERSION == 1; assert rust_backend.SCAN_BATCH_VERSION == 1'
      - name: Differential and integration contracts
        run: python -m pytest -q -ra tests/test_rust_policy_scan.py tests/test_policy_scan_contract.py tests/test_rust_filesystem.py tests/test_directory_batches.py tests/test_scan_memory_layout.py tests/test_scan_parallel.py tests/test_scan_benchmark.py tests/test_search_scan_contract.py tests/test_native_file_layer.py tests/test_linux_native.py tests/test_rust_cross_build.py tests/test_linux_policy_scan.py tests/test_linux_merged_preflight.py tests/test_wsl_drivers.py
