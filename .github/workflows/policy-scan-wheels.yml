name: Prebuilt Rust scanner wheels

on:
  workflow_dispatch:
  push:
    paths:
      - 'rust/**'
      - 'installer/rust_extension.py'
      - 'scripts/build_rust.py'
      - 'scripts/rust_wheels.py'
      - '.github/workflows/policy-scan-wheels.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'installer/rust_extension.py'
      - 'scripts/build_rust.py'
      - 'scripts/rust_wheels.py'
      - '.github/workflows/policy-scan-wheels.yml'

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: 'off'
          - platform: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            manylinux: 'off'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build ABI3 platform wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --manifest-path rust/Cargo.toml --release --locked --out rust_wheels
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/policy-scan-target
          MACOSX_DEPLOYMENT_TARGET: ${{ startsWith(matrix.platform, 'macos-arm') && '11.0' || '10.15' }}
      - name: Verify wheel selection and native import
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          python -m pip install --no-deps --no-index rust_wheels/*.whl
          python -c 'import repo_agent_scan; assert repo_agent_scan.API_VERSION == 1; assert repo_agent_scan.FILESYSTEM_API_VERSION == 1'
          python -c 'import sys, tomllib; from pathlib import Path; from scripts.rust_wheels import select_rust_wheel; version = tomllib.loads(Path("rust/pyproject.toml").read_text())["project"]["version"]; assert select_rust_wheel(Path("rust_wheels"), "${{ matrix.platform }}", sys.version.split()[0], version) is not None'
          python -m pytest -q tests/test_rust_policy_scan.py tests/test_policy_scan_contract.py tests/test_rust_filesystem.py tests/test_native_file_layer.py tests/test_rust_cross_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: rust-scanner-${{ matrix.platform }}
          path: rust_wheels/*.whl
          if-no-files-found: error
