name: Release acceptance

# Builds and qualifies candidates; publishing to GitHub Releases remains explicit.
on:
  workflow_dispatch:
    inputs:
      previous_tag:
        description: 'Older stable upgrade baseline (auto selects highest lower version)'
        type: string
        default: auto
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  source:
    uses: ./.github/workflows/host-files.yml
  rust:
    uses: ./.github/workflows/policy-scan-rust.yml
  wheels:
    uses: ./.github/workflows/policy-scan-wheels.yml
  docker:
    uses: ./.github/workflows/docker.yml
  native:
    uses: ./.github/workflows/native.yml

  packages:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-14
          - target: windows-x86_64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install locked tools and pinned exporter
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock -r requirements-build.lock
          python -m pip install uv==0.7.18
      - uses: actions/download-artifact@v8
        if: runner.os != 'Windows'
        with:
          pattern: rust-backend-*-${{ matrix.target }}
          path: rust_wheels
          merge-multiple: true
      - name: Prepare Linux isolation on disposable hosted runner
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libseccomp2
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build the candidate exactly once
        run: python scripts/build_release.py --target ${{ matrix.target }} --output dist --rust-wheelhouse rust_wheels --require-rust
      - name: Fetch an older published package for upgrade acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: python scripts/release_baseline.py --target ${{ matrix.target }} --output artifacts/previous
      - name: Accept the actual installed package (no skips)
        run: |
          archive=$(find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \))
          test -n "$archive"
          python scripts/release_acceptance.py run --profile package --target ${{ matrix.target }} --archive "$archive" --output artifacts/package
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: acceptance-package-${{ matrix.target }}
          path: artifacts/package/
          if-no-files-found: error

  release-gate:
    name: Release gate
    if: always()
    needs: [source, rust, wheels, docker, native, packages]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: acceptance-*
          path: artifacts/evidence
      - name: Require all jobs, all platforms and matching content
        env:
          RELEASE_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/release_acceptance.py gate --input artifacts/evidence --output artifacts/approved
      - uses: actions/upload-artifact@v6
        with:
          name: approved-release-${{ github.sha }}
          path: artifacts/approved/
          if-no-files-found: error

  provenance:
    name: Attest qualified tag assets
    if: github.ref_type == 'tag'
    needs: release-gate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: approved-release-${{ github.sha }}
          path: approved
      - uses: actions/attest@v4
        with:
          subject-path: 'approved/*'
