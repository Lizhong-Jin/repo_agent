[package]
name = "rust-backend"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "rust_backend"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "=0.27.2", features = ["abi3-py311"] }
libc = "=0.2.175"

[build-dependencies]
pyo3-build-config = "=0.27.2"

[dev-dependencies]
pyo3 = { version = "=0.27.2", features = ["auto-initialize"] }

[profile.release]
lto = "thin"
codegen-units = 1
