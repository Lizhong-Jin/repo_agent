[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "repo-agent-policy-scan"
version = "0.1.0"
requires-python = ">=3.11"
description = "Optional Rust policy scanner for repo-agent (Linux; macOS differential testing)"

[tool.maturin]
bindings = "pyo3"
module-name = "repo_agent_scan"
features = ["extension-module"]
locked = true
profile = "release"
